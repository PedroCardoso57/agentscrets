<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentscrets — Escritório 3D</title>
  <link rel="stylesheet" href="src/estilo.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="cena"></div>

  <header id="topo">
    <h1>agentscrets <span>escritório de agentes de IA</span></h1>
    <div id="conexao" title="Origem dos status">● demo</div>
  </header>

  <aside id="painel">
    <h2>Ordens</h2>
    <ul id="lista-ordens"><li class="vazio">Nenhuma ordem ainda. Escreva na barra de baixo: o seu bonequinho leva a ordem até a mesa do agente.</li></ul>
    <h2 class="titulo-equipe">Equipe</h2>
    <ul id="lista-agentes"></ul>
    <p class="dica">Clique num agente (aqui ou na cena) para focar e mandar ordem para ele. Arraste para girar, role para dar zoom.</p>
  </aside>

  <form id="comando" autocomplete="off">
    <label class="quem" title="Seu bonequinho de chefe">
      <span class="coroa">★</span>
      <select id="destinatario" aria-label="Para quem é a ordem"></select>
    </label>
    <input id="texto-ordem" type="text" maxlength="2000" placeholder="Dê uma ordem… (ex.: escreva 3 legendas para o post de segunda)" aria-label="Ordem" />
    <button type="submit">Enviar</button>
    <p id="aviso-ordem" role="status"></p>
  </form>

  <script type="module" src="src/main.js"></script>
</body>
</html>
